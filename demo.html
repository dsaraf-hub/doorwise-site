<title>Live Demo: Building Graph 3D</title>
<meta name="description" content="Interactive 3D walkthrough of a real 22-floor tower mapped by DoorWise in one 15-minute phone walk.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F7F8FB'/%3E%3Crect x='20' y='14' width='24' height='38' rx='3' fill='none' stroke='%233D5FA0' stroke-width='4'/%3E%3Ccircle cx='38' cy='34' r='3.5' fill='%230E9F6E'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0A0E13; --panel: #12171Ef2; --line: #232B35;
    --sjsuB: #4D8FD1; --sjsuG: #E5A823; --teal: #7EC8A0; --plum: #C88AE0;
    --route: #F4EFE6; --text: #E8EDF2; --muted: #77808C;
  }
  * { margin: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.5 system-ui, -apple-system, sans-serif; overscroll-behavior: none; }
  #scene { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #scene.dragging { cursor: grabbing; }
  .panel { position: fixed; top: 16px; left: 16px; width: 300px; max-height: calc(100% - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; backdrop-filter: blur(12px); overflow-y: auto; z-index: 2; }
  .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .eyebrow { font: 600 11px/1 ui-monospace, monospace; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 2px; }
  .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
  #collapse { display: none; background: #1A2330; color: var(--muted); border: 1px solid var(--line);
    border-radius: 8px; min-width: 40px; min-height: 40px; font-size: 18px; padding: 0; }
  .go-row { display: flex; gap: 8px; margin-bottom: 8px; }
  input { flex: 1; min-width: 0; background: #0C1117; border: 1px solid var(--line);
    border-radius: 10px; color: var(--text); padding: 12px; font: 600 18px ui-monospace, monospace; }
  input:focus { outline: none; border-color: var(--sjsuB); }
  button { background: var(--sjsuB); color: #0A0E13; border: 0; border-radius: 10px;
    padding: 12px 18px; min-height: 46px; font: 700 15px system-ui, sans-serif; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--route); outline-offset: 2px; }
  .vbtn { flex: 1; background: #0C1117; color: var(--muted); border: 1px solid var(--line);
    font-weight: 600; font-size: 14px; }
  .vbtn.on { background: #1A2330; color: var(--text); border-color: var(--sjsuB); }
  .hint { font-size: 11.5px; color: var(--muted); margin-bottom: 10px; }
  .err { color: var(--sjsuG); font-size: 12.5px; min-height: 16px; margin-bottom: 4px; }
  ol { list-style: none; display: flex; flex-direction: column; gap: 2px; }
  ol li { display: flex; gap: 10px; padding: 7px 10px; border-radius: 8px;
    font-size: 13px; color: var(--muted); transition: background .25s, color .25s; }
  ol li .n { font: 600 11px/1.9 ui-monospace, monospace; color: var(--muted);
    min-width: 14px; text-align: right; }
  ol li.active { background: #1A2330; color: var(--text); }
  ol li.active .n { color: var(--sjsuB); }
  ol li.done { color: #4E5762; }
  #caption { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 20px; font-size: 16px; font-weight: 650; text-align: center;
    max-width: min(88vw, 520px); backdrop-filter: blur(12px); display: none; z-index: 2; }
  .legend { position: fixed; right: 20px; bottom: 16px; display: flex; gap: 14px;
    font: 500 11px ui-monospace, monospace; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  @media (max-width: 640px) {
    .panel { left: 8px; right: 8px; top: 8px; width: auto; max-height: 46%; padding: 12px; }
    .panel.min { max-height: none; overflow: hidden; }
    .panel.min .body { display: none; }
    #collapse { display: block; }
    .legend { display: none; }
    h1 { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { ol li { transition: none; } }
#vWalk{display:none}
</style>

<canvas id="scene"></canvas>

<div class="panel" id="panel">
  <div class="panel-head">
    <div>
      <div class="eyebrow">DoorWise · Live Demo</div>
      <h1>Building graph, live</h1>
    </div>
    <button id="collapse" aria-label="Collapse panel">▾</button>
  </div>
  <div class="body">
    <div class="sub">22 floors · 11 doors surveyed on floor 11 · gate anchored ±6.9 m</div>
    <div class="go-row">
      <input id="unit" inputmode="numeric" placeholder="1104" value="1104" aria-label="Room number">
      <button id="go">Route</button>
    </div>
    <div class="hint">Floor+room, e.g. 1104, 1404, 2204 · drag to orbit · pinch/scroll to zoom</div>
    <div class="go-row" role="group" aria-label="View mode">
      <button id="vOrbit" class="vbtn on" type="button">Tower</button>
      <button id="vWalk" class="vbtn" type="button">First-person</button>
    </div>
    <div class="err" id="err"></div>
    <ol id="steps"></ol>
  </div>
</div>

<div id="caption"></div>

<div class="legend">
  <span><span class="dot" style="background:var(--sjsuB)"></span>lift core</span>
  <span><span class="dot" style="background:var(--sjsuG)"></span>junction</span>
  <span><span class="dot" style="background:var(--route)"></span>route</span>
</div>

<script>
// ---- CV2 graph: stitched wings from build_map.py (real survey data) ----
const DATA = {"wings":[{"dir":"left","poly":[[0.0,0.0],[-3.82,4.1],[-5.14,5.73],[-11.9,11.82],[-12.42,12.29],[-16.79,16.83],[-19.11,18.39],[-24.84,24.54],[-24.84,24.54],[-27.19,21.05]],"doors":[{"u":"1104","sfx":"04","pos":[-4.99,3.0],"proj":[-3.82,4.1],"j":false},{"u":"1106","sfx":"06","pos":[-3.9,6.73],"proj":[-5.14,5.73],"j":false},{"u":"1108","sfx":"08","pos":[-12.97,10.63],"proj":[-11.9,11.82],"j":false},{"u":"1110","sfx":"10","pos":[-11.32,13.46],"proj":[-12.42,12.29],"j":false},{"u":"1112","sfx":"12","pos":[-15.64,17.94],"proj":[-16.79,16.83],"j":false},{"u":"1114","sfx":"14","pos":[-20.01,17.07],"proj":[-19.11,18.39],"j":false},{"u":"1116","sfx":"16","pos":[-23.67,25.63],"proj":[-24.84,24.54],"j":false},{"u":"1118","sfx":"18","pos":[-25.89,25.74],"proj":[-24.84,24.54],"j":false},{"u":"1120","sfx":"20","pos":[-28.09,19.73],"proj":[-27.19,21.05],"j":false}]},{"dir":"right","poly":[[0.0,0.0],[4.83,-4.05],[6.66,-5.07]],"doors":[{"u":"1101","sfx":"01","pos":[3.8,-5.28],"proj":[4.83,-4.05],"j":false},{"u":"1103","sfx":"03","pos":[7.44,-3.67],"proj":[6.66,-5.07],"j":false}]}],"anchor":{"lat":37.32985,"lon":-121.88703,"est_error_m":6.9,"n_fixes":107},"run":{"steps_pre_lift":{"mean":46.0,"sd":2.6,"n":6,"values":[47,45,46,44,43,51]},"steps_post_lift":{"mean":41.7,"sd":4.2,"n":6,"values":[38,43,39,42,38,50]}}};
const FLOOR_H = 3.1, FLOORS = 22, SURVEYED = 11;
// trunk gate->lift: 49 steps measured; shape schematic (no headings recorded indoors)
const STRIDE = 0.7;
const TRUNK_PTS = [[-6,-30],[-6,-12],[0,-6],[0,0]];
const WINGCOLORS = ['#7EC8A0', '#E8A33D', '#C88AE0', '#7EB8E0'];

function getCSS(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

// suffix -> {wing index, door index}
const DOOR_IX = {};
DATA.wings.forEach((w, wi) => w.doors.forEach((d, di) => {
  if (!(d.sfx in DOOR_IX)) DOOR_IX[d.sfx] = { wi, di };
}));

function buildRoute(raw){
  const u = raw.trim();
  if (!/^\d{3,4}$/.test(u)) return { err: 'Room like 517 (floor 5, door 17)' };
  const fl = parseInt(u.slice(0, -2), 10), sfx = u.slice(-2);
  const ix = DOOR_IX[sfx];
  if (!ix) return { err: 'Door ' + sfx + ' not in the floor-5 survey' };
  if (fl < 2 || fl > FLOORS) return { err: 'Floor ' + fl + ' out of range (2–' + FLOORS + ')' };
  const w = DATA.wings[ix.wi], d = w.doors[ix.di];
  const z = fl * FLOOR_H + 0.4;
  const path = TRUNK_PTS.map(p => [p[0], p[1], 0.4]);
  path.push([0, 0, z]);
  if (w.poly[0][0] !== 0 || w.poly[0][1] !== 0) path.push([w.poly[0][0], w.poly[0][1], z]);
  for (let i = 1; i <= ix.di + 1 && i < w.poly.length; i++)
    path.push([w.poly[i][0], w.poly[i][1], z]);
  path.push([d.pos[0], d.pos[1], z]);
  return {
    unit: u, floor: fl, sfx, wi: ix.wi, di: ix.di, path,
    door: [d.pos[0], d.pos[1], z],
    steps: [
      'Enter the building: front desk',
      'Access rules apply past the desk',
      
      'Lift to floor ' + fl + ' (~' + Math.round(fl * FLOOR_H) + ' m up)',
      'Follow the ' + w.dir.toUpperCase() + ' corridor',
      'Room ' + u + ': template from floor 5' + (fl === SURVEYED ? ' (surveyed)' : ' (extrapolated)'),
    ],
  };
}
const stepBounds = [0.18, 0.34, 0.72, 0.92, 1.0];

// ---- shared projection state ----
const cv = document.getElementById('scene'), ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){ DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px'; }
resize(); addEventListener('resize', resize);

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobile = matchMedia('(max-width: 640px)').matches;
let theta = 0.6, autoSpin = !reduced;
const SPAN_XY = (() => {
  let m = 8;
  const eat = p => { m = Math.max(m, Math.hypot(p[0], p[1])); };
  (DATA.wings||[]).forEach(w => { w.poly.forEach(eat); (w.doors||[]).forEach(d => eat(d.pos)); });
  (TRUNK_PTS||[]).forEach(eat);
  return m;
})();
const fitScale = () => Math.min(W / (SPAN_XY * 2.7), H / (FLOORS * FLOOR_H * 1.30));
let scale = 9;
const refit = () => { scale = fitScale(); };
refit(); addEventListener('resize', refit);
let viewMode = 'orbit';
const ZC = FLOORS * FLOOR_H / 2;
const CX = () => W * (mobile ? 0.5 : 0.60), CY = () => H * (mobile ? 0.62 : 0.55);

function proj(x, y, z){
  const c = Math.cos(theta), s = Math.sin(theta);
  const rx = x*c - y*s, depth = x*s + y*c;
  return [CX() + rx*scale, CY() - (z - ZC)*scale*0.92 - depth*scale*0.30, depth];
}
function line(a, b, color, w, alpha, dash){
  const A = proj(...a), B = proj(...b);
  ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = w;
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;
}
function node(p, color, r, alpha = 1){
  const P = proj(...p); ctx.fillStyle = color; ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.arc(P[0], P[1], r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
}
function label(p, txt, color){
  const P = proj(...p);
  ctx.font = '600 10px ui-monospace, monospace'; ctx.fillStyle = color || '#77808C';
  ctx.fillText(txt, P[0] + 8, P[1] - 8);
}

let route = null, animT = 0, animLen = 1;
function pathLength(p){ let L = 0;
  for (let i = 1; i < p.length; i++){ const a = p[i-1], b = p[i];
    L += Math.hypot(b[0]-a[0], b[1]-a[1], (b[2]-a[2]) * 0.55); } return L; }
function pointAt(p, t){
  for (let i = 1; i < p.length; i++){ const a = p[i-1], b = p[i];
    const d = Math.hypot(b[0]-a[0], b[1]-a[1], (b[2]-a[2]) * 0.55);
    if (t <= d){ const f = d ? t/d : 0;
      return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f]; }
    t -= d; }
  return p[p.length - 1];
}
function updateSteps(prog){
  document.querySelectorAll('#steps li').forEach((li, i) => {
    li.classList.toggle('done', prog > stepBounds[i]);
    li.classList.toggle('active', prog <= stepBounds[i] && (i === 0 || prog > stepBounds[i-1]));
  });
}

// ---- orbit view ----
function drawOrbit(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const routeC = getCSS('--route'), gold = getCSS('--sjsuG'), blue = getCSS('--sjsuB');

  // lift core
  line([0, 0, 0], [0, 0, FLOORS * FLOOR_H], blue, 3, 0.85);
  for (let f = 0; f <= FLOORS; f++) node([0, 0, f * FLOOR_H], blue, 1.8, 0.5);
  label([0, 0, FLOORS * FLOOR_H + 1.5], 'Live · ' + FLOORS + 'F', blue);
  // trunk
  for (let i = 1; i < TRUNK_PTS.length; i++)
    line([...TRUNK_PTS[i-1], 0.4], [...TRUNK_PTS[i], 0.4], '#2A3644', 2, 0.9);
  node([...TRUNK_PTS[0], 0.4], routeC, 3.5, 0.9);
  label([...TRUNK_PTS[0], 2.5], 'ENTRANCE ±1m', routeC);

  // wings on every floor (faint), surveyed + routed floor bright
  for (let f = 2; f <= FLOORS; f++){
    const z = f * FLOOR_H;
    const bright = f === SURVEYED || (route && f === route.floor);
    
    DATA.wings.forEach((w, wi) => {
      const c = WINGCOLORS[wi % WINGCOLORS.length];
      for (let i = 1; i < w.poly.length; i++)
        line([w.poly[i-1][0], w.poly[i-1][1], z], [w.poly[i][0], w.poly[i][1], z],
             c, bright ? 1.6 : 1.1, bright ? 0.6 : 0.32);
      for (const d of w.doors){
        if (bright) node([d.pos[0], d.pos[1], z], d.j ? gold : c, d.j ? 3.2 : 2, 0.85);
        else node([d.pos[0], d.pos[1], z], c, 1.3, 0.30);
      }
    });
  }
  if (route){
    const t = Math.min(animT, animLen);
    ctx.shadowColor = routeC; ctx.shadowBlur = 10;
    let acc = 0;
    for (let i = 1; i < route.path.length; i++){
      const a = route.path[i-1], b = route.path[i];
      const d = Math.hypot(b[0]-a[0], b[1]-a[1], (b[2]-a[2]) * 0.55);
      if (acc + d <= t) line(a, b, routeC, 2.4, 0.95);
      else if (acc < t){ const f = (t - acc) / d;
        line(a, [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f], routeC, 2.4, 0.95); }
      acc += d;
    }
    ctx.shadowBlur = 0;
    const dot = pointAt(route.path, t);
    ctx.shadowColor = routeC; ctx.shadowBlur = 16; node(dot, routeC, 5); ctx.shadowBlur = 0;
    if (t >= animLen){ const p = performance.now() / 500;
      node(route.door, routeC, 6 + Math.sin(p) * 2, 0.5); }
    updateSteps(t / animLen);
  }
}

// ---- first-person view ----
const INT = { wall:'#E8E4DC', wallShade:'#D2CCC0', ceil:'#F0EDE6', carpet:'#31404F',
              door:'#3E5A78', frame:'#22303C', steel:'#93A9BA' };
function hexRGB(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function mixHex(a, b, f){ const A = hexRGB(a), B = hexRGB(b);
  return 'rgb(' + A.map((v,i) => Math.round(v + (B[i]-v)*f)).join(',') + ')'; }

function corridorQuads(poly, z0, half){
  const quads = [];
  for (let i = 1; i < poly.length; i++){
    const [ax, ay] = poly[i-1], [bx, by] = poly[i];
    const dx = bx-ax, dy = by-ay, L = Math.hypot(dx, dy); if (L < 0.01) continue;
    const nx = -dy/L, ny = dx/L, nSub = Math.max(1, Math.ceil(L / (mobile ? 4 : 2.5)));
    for (let k = 0; k < nSub; k++){
      const f0 = k/nSub, f1 = (k+1)/nSub;
      const p0 = [ax+dx*f0, ay+dy*f0], p1 = [ax+dx*f1, ay+dy*f1];
      for (const s of [-1, 1]){
        const w0 = [p0[0]+nx*half*s, p0[1]+ny*half*s], w1 = [p1[0]+nx*half*s, p1[1]+ny*half*s];
        quads.push({ pts: [[...w0, z0], [...w1, z0], [...w1, z0+2.9], [...w0, z0+2.9]],
                     color: s < 0 ? INT.wallShade : INT.wall });
      }
      const l0 = [p0[0]-nx*half, p0[1]-ny*half], l1 = [p1[0]-nx*half, p1[1]-ny*half];
      const r0 = [p0[0]+nx*half, p0[1]+ny*half], r1 = [p1[0]+nx*half, p1[1]+ny*half];
      quads.push({ pts: [[...l0, z0], [...l1, z0], [...r1, z0], [...r0, z0]], color: INT.carpet });
      quads.push({ pts: [[...l0, z0+2.9], [...l1, z0+2.9], [...r1, z0+2.9], [...r0, z0+2.9]], color: INT.ceil });
    }
  }
  return quads;
}
function doorQuads(w, d, z0, hot, routeC){
  const i = Math.min(w.doors.indexOf(d) + 1, w.poly.length - 1);
  const [ax, ay] = w.poly[i-1], [bx, by] = w.poly[i];
  const dx = bx-ax, dy = by-ay, L = Math.hypot(dx, dy) || 1, tx = dx/L, ty = dy/L;
  const [cx2, cy2] = d.pos;
  const q = (wd, h) => ({ pts: [[cx2-tx*wd, cy2-ty*wd, z0], [cx2+tx*wd, cy2+ty*wd, z0],
                                [cx2+tx*wd, cy2+ty*wd, z0+h], [cx2-tx*wd, cy2-ty*wd, z0+h]] });
  const frame = { ...q(0.62, 2.25), color: INT.frame };
  const panel = { ...q(0.45, 2.1), color: INT.door };
  if (hot){ panel.glow = routeC; panel.edge = routeC; }
  return [frame, panel];
}
function fpDraw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#07090C'; ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (!route) return;
  const routeC = getCSS('--route'), blue = getCSS('--sjsuB'), BG = '#07090C';
  const t = Math.min(animT, animLen);
  const pos = pointAt(route.path, t);
  let ahead = pointAt(route.path, Math.min(t + 2.0, animLen));
  let fx = ahead[0]-pos[0], fy = ahead[1]-pos[1];
  if (Math.hypot(fx, fy) < 0.05){
    const w = DATA.wings[route.wi];
    fx = w.poly[1][0] - w.poly[0][0]; fy = w.poly[1][1] - w.poly[0][1];
    if (Math.hypot(fx, fy) < 0.05){ fx = w.poly[0][0]; fy = w.poly[0][1]; }
  }
  const fl2 = Math.hypot(fx, fy) || 1; fx /= fl2; fy /= fl2;
  const eye = [pos[0], pos[1], pos[2] + 1.2];
  const fov = Math.min(W, H) * 0.9, NEAR = 0.25;
  const cam = p => { const dx = p[0]-eye[0], dy = p[1]-eye[1], dz = p[2]-eye[2];
    return [dx*fx + dy*fy, dx*fy - dy*fx, dz]; };
  const SX = z => W*0.5 + z[1]/z[0]*fov, SY = z => H*0.52 - z[2]/z[0]*fov;
  function clipPoly(pts){
    let out = [];
    for (let i = 0; i < pts.length; i++){
      const A = pts[i], B = pts[(i+1) % pts.length], aIn = A[0] >= NEAR, bIn = B[0] >= NEAR;
      if (aIn) out.push(A);
      if (aIn !== bIn){ const f = (A[0]-NEAR)/(A[0]-B[0]);
        out.push([NEAR, A[1]+(B[1]-A[1])*f, A[2]+(B[2]-A[2])*f]); }
    }
    return out;
  }
  function fillQuad(q){
    const c = q.pts.map(cam), clipped = clipPoly(c);
    if (clipped.length < 3) return;
    const depth = c.reduce((s, p) => s + Math.max(p[0], NEAR), 0) / c.length;
    if (depth > 60) return;
    const fog = Math.min(0.88, Math.max(0, depth / 34));
    ctx.fillStyle = q.color.startsWith('#') ? mixHex(q.color, BG, fog) : q.color;
    if (q.glow){ ctx.shadowColor = q.glow; ctx.shadowBlur = 14; }
    ctx.beginPath(); ctx.moveTo(SX(clipped[0]), SY(clipped[0]));
    for (let i = 1; i < clipped.length; i++) ctx.lineTo(SX(clipped[i]), SY(clipped[i]));
    ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    if (q.edge){ ctx.strokeStyle = q.edge; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.9;
      ctx.stroke(); ctx.globalAlpha = 1; }
  }
  function fline(a, b, color, w2, alpha){
    let A = cam(a), B = cam(b);
    if (A[0] < NEAR && B[0] < NEAR) return;
    if (A[0] < NEAR || B[0] < NEAR){ const [F, Bk] = A[0] < NEAR ? [B, A] : [A, B];
      const f = (F[0]-NEAR)/(F[0]-Bk[0]);
      B = [NEAR, F[1]+(Bk[1]-F[1])*f, F[2]+(Bk[2]-F[2])*f]; A = F; }
    ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = w2;
    ctx.beginPath(); ctx.moveTo(SX(A), SY(A)); ctx.lineTo(SX(B), SY(B)); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  const inLift = Math.abs(pos[0]) < 0.4 && Math.abs(pos[1]) < 0.4 && pos[2] > 1.5 && t < animLen * 0.99;
  const floorZ = route.door[2] - 0.4;

  const scene = [...corridorQuads(TRUNK_PTS, 0, 1.5)];
  DATA.wings.forEach(w => scene.push(...corridorQuads(w.poly, floorZ, 1.4)));
  scene.sort((a, b) => {
    const da = a.pts.reduce((s, p) => s + cam(p)[0], 0), db = b.pts.reduce((s, p) => s + cam(p)[0], 0);
    return db - da;
  });
  for (const q of scene) fillQuad(q);

  const doorQs = [];
  DATA.wings.forEach((w, wi) => w.doors.forEach(d => {
    doorQs.push(...doorQuads(w, d, floorZ, wi === route.wi && d.sfx === route.sfx, routeC));
  }));
  doorQs.sort((a, b) => {
    const da = a.pts.reduce((s, p) => s + cam(p)[0], 0), db = b.pts.reduce((s, p) => s + cam(p)[0], 0);
    return db - da;
  });
  for (const q of doorQs) fillQuad(q);

  for (const z0 of [0, floorZ]){
    fillQuad({ pts: [[-0.95, -0.95, z0], [0.95, 0.95, z0], [0.95, 0.95, z0+2.5], [-0.95, -0.95, z0+2.5]],
               color: INT.frame });
    fillQuad({ pts: [[-0.75, -0.75, z0], [0.75, 0.75, z0], [0.75, 0.75, z0+2.35], [-0.75, -0.75, z0+2.35]],
               color: INT.steel, glow: blue, edge: blue });
  }
  ctx.shadowColor = routeC; ctx.shadowBlur = 10;
  for (let i = 1; i < route.path.length; i++)
    fline([route.path[i-1][0], route.path[i-1][1], route.path[i-1][2]-0.32],
          [route.path[i][0], route.path[i][1], route.path[i][2]-0.32], routeC, 2.4, 0.9);
  ctx.shadowBlur = 0;
  const cap = document.getElementById('caption');
  if (inLift){
    ctx.fillStyle = '#E8EDF2'; ctx.font = '700 40px ui-monospace, monospace'; ctx.textAlign = 'center';
    ctx.shadowColor = blue; ctx.shadowBlur = 18;
    ctx.fillText('FLOOR ' + Math.max(1, Math.round(pos[2] / FLOOR_H)), W/2, H*0.30);
    ctx.shadowBlur = 0; ctx.textAlign = 'left';
  }
  const prog = t / animLen; let idx = stepBounds.findIndex(b => prog <= b); if (idx < 0) idx = 4;
  cap.textContent = prog >= 1 ? '✓ Room ' + route.unit + ': arrived' : route.steps[idx];
  updateSteps(prog);
}

// ---- loop + input ----
let last = performance.now();
function frame(now){
  const dt = (now - last) / 1000; last = now;
  if (autoSpin && viewMode === 'orbit') theta += dt * 0.10;
  if (route && animT < animLen && !window.__HERO__) animT += dt * animLen / (viewMode === 'walk' ? 16 : 9);
  if (viewMode === 'walk') fpDraw(); else drawOrbit();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// touch: one-finger orbit, two-finger pinch zoom
const pointers = new Map();
let pinchBase = null;
cv.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  autoSpin = false; cv.setPointerCapture(e.pointerId);
  if (pointers.size === 1){ cv.classList.add('dragging'); pinchBase = null; }
  else if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinchBase = { d: Math.hypot(a.x-b.x, a.y-b.y), s: scale };
  }
});
cv.addEventListener('pointermove', e => {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  if (pointers.size === 1 && viewMode === 'orbit') theta += (e.clientX - prev.x) * 0.008;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && pinchBase){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    scale = Math.max(3, Math.min(18, pinchBase.s * d / pinchBase.d));
  }
});
const endPointer = e => { pointers.delete(e.pointerId);
  if (!pointers.size) cv.classList.remove('dragging'); pinchBase = null; };
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
addEventListener('wheel', e => { scale = Math.max(3, Math.min(18, scale - e.deltaY * 0.01)); }, { passive: true });

function setView(m){
  viewMode = m;
  document.getElementById('vOrbit').classList.toggle('on', m === 'orbit');
  document.getElementById('vWalk').classList.toggle('on', m === 'walk');
  document.getElementById('caption').style.display = m === 'walk' ? 'block' : 'none';
  if (m === 'walk'){
    if (route && animT >= animLen && !reduced) animT = 0;
    if (mobile) document.getElementById('panel').classList.add('min');
  }
}
document.getElementById('vOrbit').addEventListener('click', () => setView('orbit'));
document.getElementById('vWalk').addEventListener('click', () => setView('walk'));
document.getElementById('collapse').addEventListener('click', () => {
  const p = document.getElementById('panel');
  p.classList.toggle('min');
  document.getElementById('collapse').textContent = p.classList.contains('min') ? '▸' : '▾';
});

function go(){
  const r = buildRoute(document.getElementById('unit').value);
  const err = document.getElementById('err'), ol = document.getElementById('steps');
  if (r.err){ err.textContent = r.err; return; }
  err.textContent = '';
  route = r; animLen = pathLength(r.path); animT = reduced ? animLen : 0;
  ol.innerHTML = r.steps.map((s, i) =>
    '<li><span class="n">' + (i+1) + '</span><span>' + s + '</span></li>').join('');
  document.getElementById('unit').blur();
}
document.getElementById('go').addEventListener('click', go);
document.getElementById('unit').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
go();

// hero-embed: ?fpv=UNIT hides UI, enters first-person, and syncs to parent clock
(() => {
  const HERO = new URLSearchParams(location.search).get('fpv');
  if (!HERO) return;
  window.__HERO__ = true;
  document.getElementById('panel').style.display = 'none';
  const lg = document.querySelector('.legend'); if (lg) lg.style.display = 'none';
  document.getElementById('unit').value = HERO;
  go(); setView('walk');
  const seg = () => {
    const p = route.path, cum = [0];
    for (let i = 1; i < p.length; i++){
      const a = p[i-1], b = p[i];
      cum.push(cum[i-1] + Math.hypot(b[0]-a[0], b[1]-a[1], (b[2]-a[2]) * 0.55));
    }
    let s = -1, e = -1;
    for (let i = 1; i < p.length; i++)
      if (Math.abs(p[i][2] - p[i-1][2]) > 1){ if (s < 0) s = i - 1; e = i; }
    const total = cum[cum.length-1];
    return { ls: s >= 0 ? cum[s] : total, le: e >= 0 ? cum[e] : total, total };
  };
  addEventListener('message', ev => {
    const d = ev.data || {};
    if (d.dw !== 't' || !route) return;
    const { ls, le, total } = seg();
    const P = d.P, t = d.t;
    let a;
    if (t <= P.gateEnd) a = (t / P.gateEnd) * ls;
    else if (t <= P.liftIn) a = ls;
    else if (t <= P.climbEnd) a = ls + (le - ls) * (t - P.liftIn) / (P.climbEnd - P.liftIn);
    else if (t <= P.walkEnd) a = le + (total - le) * (t - P.climbEnd) / (P.walkEnd - P.climbEnd);
    else a = total;
    animT = a;
  });
})();
</script>
