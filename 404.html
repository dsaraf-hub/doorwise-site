<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found, DoorWise</title>
<meta name="description" content="This page doesn't exist. Head back to DoorWise, indoor navigation for deliveries.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#F7F8FB;--line:#D8E0EF;--text:#1E3A66;--muted:#5E7191;--accent:#3D5FA0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
     min-height:100vh;display:flex;flex-direction:column;overflow-x:clip}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.code{font-family:"IBM Plex Mono",monospace;color:#C9871A;font-size:13px;font-weight:700;letter-spacing:.14em;margin-bottom:14px}
h1{font-size:clamp(26px,5vw,40px);letter-spacing:-.02em;margin-bottom:12px}
p{color:var(--muted);max-width:46ch;margin:0 auto 28px}
.btn{display:inline-block;padding:12px 24px;border-radius:6px;font-weight:600;font-size:15px;background:#1E3A66;color:#F7F8FB}
.btn:hover{background:#3D5FA0;text-decoration:none}
footer{border-top:1px solid var(--line);padding:32px 20px;color:var(--muted);font-size:14px}
.foot{max-width:960px;margin:0 auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.foot-links{display:flex;gap:16px}
.foot-links a{color:var(--muted)}
.foot-links a:hover{color:var(--text)}
@media (max-width:760px){.foot{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<main>
  <div>
    <div class="code">404</div>
    <h1>This door doesn't exist.</h1>
    <p>We map every door in a building, but not this one. The page you're looking
    for was moved or never existed.</p>
    <a class="btn" href="./">Back to DoorWise</a>
  </div>
</main>
<footer>
  <div class="foot">
    <div>© 2026 DoorWise. All rights reserved.</div>
    <nav class="foot-links" aria-label="Footer">
      <a href="./#how">How it works</a>
      <a href="./#demo">Demo</a>
      <a href="mailto:dakshhsaraf@gmail.com">Email</a>
    </nav>
  </div>
</footer>
</body>
</html>
